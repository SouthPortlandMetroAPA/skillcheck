<!DOCTYPE html>
<!--
  SkillCheck — South Portland Metro APA · ask for a skill level review (v0.5)
  ─────────────────────────────────────────────────────────────────────────────
  Brief: tools/claude/briefs/2026-09-18-skillcheck.md  (T1)
  WHO   a signed-in member (magic link → durable device session, NickPick/CrewCall model).
  WHAT  a short context note (rubric-scored, see brief) → "Myself" or "Another player"
        (CueDrop member picker; server restricts subjects to current-session SPM rosters)
        → team (from the roster) → 8-Ball / 9-Ball → current SL shown from the record
        → the level you think is right → what you saw (min 60 chars) → optional date/opponent.
  DATA  everything goes through the apa-mailer GAS (text/plain POST, never application/json):
        sl_link_request · sl_verify · sl_logout · sl_context · sl_player · sl_submit · sl_my.
        The anon key reaches only countmein.member_lookup (name/#/team) for the picker.
  MAIL  link (to the address on file) · ack to the requester · office notify. Decisions come
        from Slate ▸ Skill Reviews. The subject is never told who asked (Team Manual §22).
  Brand: spm-base.css. Auto-updater: apa_core.apps row "SkillCheck" → version.js (serve-then-bump).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SkillCheck — South Portland Metro APA</title>
<meta name="theme-color" content="#ea002a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://southportlandmetroapa.github.io/shared/spm-base.css">
<script src="version.js"></script>
<script src="https://southportlandmetroapa.github.io/shared/spm-auth.js"></script>
<style>
  [hidden]{ display:none !important; }
  .spm-page{ max-width:560px; }
  .lead{ color:var(--muted); margin:2px 0 14px; font-size:.98rem; }
  .lbl{ font-weight:800; font-size:1.02rem; margin:14px 0 6px; display:block; color:var(--text); }
  .sub{ color:var(--muted); font-size:.88rem; margin:0 0 8px; }
  input[type=text],input[type=date],input[type=email],select,textarea{ width:100%; font:inherit; padding:13px 14px; border:2px solid var(--border); border-radius:12px; background:#fff; min-height:48px; color:var(--text); box-sizing:border-box; }
  textarea{ min-height:120px; resize:vertical; }
  input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--spm-accent); }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ border:2px solid var(--border); background:#fff; border-radius:999px; padding:10px 14px; font:inherit; font-size:.95rem; min-height:48px; cursor:pointer; color:var(--text); }
  .chip[aria-pressed="true"]{ border-color:var(--spm-accent); background:#eef2ff; color:var(--spm-accent); font-weight:700; }
  .btn{ width:100%; font:inherit; font-weight:800; font-size:1.05rem; border:none; border-radius:999px; padding:15px 20px; min-height:54px; cursor:pointer; background:linear-gradient(135deg,var(--spm-primary),var(--spm-accent)); color:#fff; margin-top:14px; }
  .btn:disabled{ background:#c9ccd6; cursor:not-allowed; }
  .btn.ghost{ background:#fff; color:var(--text); border:2px solid var(--border); }
  .err{ color:var(--spm-primary); font-size:.92rem; min-height:1.2em; margin:8px 0 0; }
  .fine{ color:var(--muted); font-size:.82rem; text-align:center; margin:10px 0 0; }
  .hp{ position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
  .rec{ display:flex; align-items:center; gap:12px; border:2px solid var(--border); border-radius:14px; padding:12px 14px; background:#fbfbfd; }
  .rec .sl{ font-size:1.6rem; font-weight:900; color:var(--spm-accent); min-width:2.2em; text-align:center; }
  .rec .who{ flex:1; } .rec .who b{ display:block; font-size:1.02rem; }
  .ctl{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 0 10px; }
  .ctl button{ background:none; border:none; color:var(--spm-accent); font:inherit; font-weight:700; cursor:pointer; min-height:40px; padding:6px 0; }
  .card-list .row{ border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:.92rem; }
  .tag{ display:inline-block; font-size:.7rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:2px 8px; border-radius:999px; background:#fff3cd; color:#7a5a00; }
  .tag.done{ background:#e6f7ec; color:#0a7d33; }
  /* the context note — a modal on top of the form */
  .note-back{ position:fixed; inset:0; background:rgba(20,30,50,.55); z-index:200; display:flex; align-items:center; justify-content:center; padding:16px; }
  .note{ background:#fff; border-radius:18px; max-width:420px; width:100%; padding:20px 20px 18px; box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .note h2{ margin:0 0 10px; font-size:1.15rem; }
  .note p{ margin:0 0 12px; font-size:17px; line-height:1.5; }   /* 17px: bigger reads faster at a glance (NN/g) */
  .note .btn{ margin-top:6px; }
  /* member picker — CueDrop .cd-* (house rule: never free-text a player) */
  .cd-search{ position:relative; }
  .cd-ac{ display:none; position:absolute; left:0; right:0; top:100%; z-index:40; background:#fff; border:1px solid #d7dbe0; border-radius:10px; margin-top:4px; box-shadow:0 8px 24px rgba(0,0,0,.12); max-height:260px; overflow:auto; }
  .cd-ac.show{ display:block; }
  .cd-ac-item{ padding:12px; cursor:pointer; border-bottom:1px solid #f1f3f5; min-height:48px; box-sizing:border-box; }
  .cd-ac-item:last-child{ border-bottom:0; } .cd-ac-item:hover,.cd-ac-item.on{ background:#f3f4f6; }
  .cd-ac-name{ font-weight:700; font-size:.95rem; } .cd-ac-sub{ font-size:.78rem; color:#6b7280; margin-top:1px; }
  .cd-picked{ margin-top:8px; padding:10px 12px; border-radius:10px; background:#eef6ee; border:1px solid #cfe3cf; font-size:.92rem; display:flex; gap:8px; align-items:center; justify-content:space-between; min-height:48px; }
  .cd-picked button{ background:none; border:0; color:#b8001f; font-weight:700; cursor:pointer; font-size:.88rem; padding:6px; min-height:40px; }
  .spin{ display:inline-block; width:26px; height:26px; border:3px solid #e5e7eb; border-top-color:var(--spm-primary); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .need{ margin:10px 0 0; font-size:.88rem; line-height:1.45; color:#7a5a00; background:#fff8e1; border:1px solid #f0e0a8; border-radius:10px; padding:8px 10px; }
  .need b{ font-weight:800; }
  .need:empty{ display:none; border:0; padding:0; margin:0; }
  #updateOverlay{ position:fixed; inset:0; background:rgba(255,255,255,.96); z-index:9999; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; text-align:center; padding:24px; }
  #updateOverlay.show{ display:flex; }
</style>
</head>
<body>
  <div id="updateOverlay"><div class="spin"></div><div><b>Updating…</b><br>Grabbing the latest version.</div></div>
  <div class="spm-page spm-wide">
    <header class="spm-header">
      <h1>SkillCheck 🎯</h1>
      <p class="spm-subtitle">South Portland Metro APA · skill level review</p>
    </header>
    <div class="spm-shell">
      <main class="spm-card">
        <div class="ctl" id="ctl" hidden><span id="whoami" class="sub" style="margin:0"></span><button type="button" id="logout">Log out</button></div>
        <div id="app"></div>
      </main>
      <aside class="spm-rail" id="rail" aria-live="polite"></aside>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzGTzkBRTrIIP_tD6sbtOOUmNZkXDdtxPoO4c8fdWt5h3tZFueNSISPv8Q3LWStx73Whw/exec';
  const SB_URL = 'https://dqzbekoaysgaiqljueac.supabase.co';
  const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxemJla29heXNnYWlxbGp1ZWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNzA5NzgsImV4cCI6MjA5MDc0Njk3OH0.cCdGxZ4zEFzU_r6lWSDeoNWG67Q4MSYCAtpds035dfU';
  const APP_NAME = 'SkillCheck';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  /* GAS: text/plain body, never application/json (CORS preflight GAS cannot answer) */
  const gas = (action, extra) => fetch(GAS_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action }, extra || {})) }).then(r => r.json()).catch(() => ({ ok: false, error: 'Network hiccup. Check your connection and try again.' }));
  const S = { token: null, firstName: '', me: null, about: null, subject: null, cluster: null, team: null, format: null, proposed: null, acked: false, opened: Date.now() };
  const app = $('app');
  const RANGE = { '8': [2, 3, 4, 5, 6, 7], '9': [1, 2, 3, 4, 5, 6, 7, 8, 9] };

  /* ── screens ── */
  function showLogin(msg) {
    renderRail();                     /* the signed-out screen keeps no trace of the last person's work */
    $('ctl').hidden = true;
    app.innerHTML = '<p class="lead">Ask the league to review a skill level — yours or another player\'s. Sign in with the email or APA number on your record; we send a link, no password.</p>'
      + (msg ? '<div class="err" style="margin-bottom:8px">' + esc(msg) + '</div>' : '')
      + '<label class="lbl" for="ident">Your email or APA number</label><input id="ident" type="text" autocomplete="email" inputmode="email" placeholder="you@example.com or 12345678">'
      + '<input class="hp" type="text" name="website" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">'
      + '<div class="err" id="err"></div><button class="btn" id="send">Email me a sign-in link</button>'
      + '<p class="fine">The link goes only to the email on your APA record.</p>';
    $('send').onclick = async () => {
      const v = $('ident').value.trim(); if (!v) { $('err').textContent = 'Enter your email or APA number.'; return; }
      $('send').disabled = true; $('err').textContent = '';
      const r = await gas('sl_link_request', { identifier: v, hp: $('hp').value });
      if (!r.ok) { $('err').textContent = r.error || 'Something went wrong.'; $('send').disabled = false; return; }
      app.innerHTML = '<h2 style="margin:0 0 6px">Check your email' + (r.first_name ? ', ' + esc(r.first_name) : '') + '.</h2><p class="lead">We sent a sign-in link to the address on your APA record. It works for 30 minutes and keeps you signed in on this device.</p><button class="btn ghost" id="again">Use a different email or number</button>';
      $('again').onclick = () => showLogin();
    };
  }
  function showHome() {
    $('ctl').hidden = false; $('whoami').textContent = S.firstName ? 'Signed in as ' + S.firstName : 'Signed in';
    S.about = null; S.subject = null; S.cluster = null; S.team = null; S.format = null; S.proposed = null; renderRail();
    app.innerHTML = '<p class="lead">Who is this review about?</p>'
      + '<button class="btn" id="self">Myself</button><button class="btn ghost" id="other">Another player</button>'
      + '<div id="mine" class="card-list" style="margin-top:22px"></div>';
    $('self').onclick = () => { S.about = 'self'; renderRail(); showNote(); };
    $('other').onclick = () => { S.about = 'other'; renderRail(); showNote(); };
    gas('sl_my', { token: S.token }).then(r => {
      if (!r.ok || !r.requests || !r.requests.length) return;
      $('mine').innerHTML = '<span class="lbl">Your requests</span>' + r.requests.map(q => '<div class="row"><span class="tag' + (q.status === 'pending' ? '' : ' done') + '">' + esc(q.status === 'no_change' ? 'no change' : q.status) + '</span> '
        + esc(q.about_self ? 'Yourself' : q.subject_name) + ' · ' + (q.format === '8' ? '8-Ball' : '9-Ball') + ' · ' + (q.claimed_current_sl ? 'SL' + q.claimed_current_sl + ' → ' : '') + 'SL' + q.proposed_sl + ' · ' + new Date(q.created_at).toLocaleDateString()
        + (q.decision_note ? '<div class="sub" style="margin:4px 0 0">' + esc(q.decision_note) + '</div>' : '') + '</div>').join('');
    });
  }
  /* The context note — the one screen every request passes through (rubric R3, brief 2026-09-18). */
  function showNote() {
    S.acked = false; S.opened = Date.now();
    const back = document.createElement('div'); back.className = 'note-back'; back.id = 'noteBack'; back.setAttribute('role', 'dialog'); back.setAttribute('aria-modal', 'true'); back.setAttribute('aria-labelledby', 'noteTitle');
    /* R4 — glanceable (NN/g): three lines, each front-loaded with a bold lead that carries the meaning alone
       ("first 2 words" + scannable skeleton), 17px body, one action. Rubric + sources in the brief. */
    back.innerHTML = '<div class="note"><h2 id="noteTitle">Before you start</h2>'
      + '<p><b>Hot nights happen.</b> Levels come from the scoresheets; your eyes at the table help us get them right.</p>'
      + '<p><b>Tell us what you saw.</b> Shots, safeties, innings. Not just the score.</p>'
      + '<p><b>We read every one.</b> Kept private, checked against the record, and you\'ll hear back either way.</p>'
      + '<button class="btn" id="gotit">Got it</button></div>';
    document.body.appendChild(back);
    $('gotit').onclick = () => { S.acked = true; back.remove(); S.about === 'self' ? showSelf() : showPick(); };
    $('gotit').focus();
  }
  function showSelf() {
    app.innerHTML = '<div class="center" style="padding:20px;text-align:center"><span class="spin"></span></div>';
    gas('sl_context', { token: S.token }).then(r => {
      if (!r.ok) return handleSessionErr(r.error);
      if (!r.me || !r.me.teams.length) { app.innerHTML = '<p class="lead">We don\'t see you on a South Portland Metro team this session, so there is no skill level to review yet. If that is wrong, email <a href="mailto:southportlandmetroapa@gmail.com">southportlandmetroapa@gmail.com</a>.</p><button class="btn ghost" id="back">Back</button>'; $('back').onclick = showHome; return; }
      S.subject = r.me; showForm();
    });
  }
  function showPick() {
    app.innerHTML = '<label class="lbl" for="cdSearch">Which player?</label><p class="sub">Start typing a name or APA number and pick them from the list. Only players on a South Portland Metro team this session can be reviewed.</p>'
      + '<div class="cd-search"><input type="text" id="cdSearch" autocomplete="off" placeholder="Name or APA number"><div id="cdAc" class="cd-ac"></div><div id="cdPicked" class="cd-picked" hidden></div></div>'
      + '<div class="err" id="err"></div><button class="btn ghost" id="back">Back</button>';
    $('back').onclick = showHome;
    cdWire(async p => {
      $('err').textContent = ''; const r = await gas('sl_player', { token: S.token, member: p.member_number });
      if (!r.ok) { $('err').textContent = r.error || 'Could not load that player.'; cdClear(); return; }
      S.subject = r.player; renderRail(); showForm();
    });
  }
  function showForm() {
    const me = S.about === 'self', p = S.subject;
    /* one chip per TEAM (cluster = same name · night · shared roster; the server tags every number with its cluster), then the format */
    const clusters = []; p.teams.forEach(t => { let c = clusters.find(x => x.id === (t.cluster_id || t.team_number)); if (!c) { c = { id: t.cluster_id || t.team_number, label: t.label || t.team_name, night: t.night || '', entries: [] }; clusters.push(c); } c.entries.push(t); });
    app.innerHTML = '<div class="rec"><div class="who"><b>' + esc(p.name) + '</b><span class="sub" style="margin:0">#' + esc(p.member_number) + ' · ' + esc(p.session_name || '') + '</span></div></div>'
      + '<label class="lbl">Which team?</label><div class="chips" id="teams">' + clusters.map((c, i) => '<button type="button" class="chip" data-i="' + i + '" aria-pressed="false">' + esc(c.label) + (c.night ? ' <span class="sub" style="margin:0">· ' + esc(c.night.slice(0, 3)) + '</span>' : '') + '</button>').join('') + '</div>'
      + '<div id="fmtWrap" hidden><label class="lbl">Which format?</label><div class="chips" id="fmts"></div></div>'
      + '<div id="slWrap" hidden><div class="spm-two"><div><label class="lbl" for="claimed">' + (me ? 'Your current skill level' : 'Their current skill level') + '</label><select id="claimed"></select></div>'
      + '<div><label class="lbl" for="proposed">' + (me ? 'The level you think is right' : 'The level you think they should be') + '</label><select id="proposed"></select></div></div>'
      + '<label class="lbl" for="why">What did you see?</label><p class="sub">Shots they made, how they played safeties, innings, who they beat, how often you have watched them. Specifics are what make a review possible.</p><textarea id="why" maxlength="3000" placeholder="A few sentences."></textarea>'
      + '<label class="lbl" for="seen">When did you see it? <span style="font-weight:400">(optional)</span></label><div class="spm-two"><input type="date" id="seen"><input type="text" id="opp" maxlength="120" placeholder="Against whom? (optional)" aria-label="Against whom (optional)"></div>'
      + '<input class="hp" type="text" name="website" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true"><div class="err" id="err"></div><div class="need" id="need" aria-live="polite"></div><button class="btn" id="submit" disabled>Send my request</button><p class="fine">Kept private. The player is never told who asked.</p></div>'
      + '<button class="btn ghost" id="back">Back</button>';
    $('back').onclick = showHome;
    $('seen').max = new Date().toISOString().slice(0, 10);
    $('teams').querySelectorAll('.chip').forEach(b => b.onclick = () => { $('teams').querySelectorAll('.chip').forEach(o => o.setAttribute('aria-pressed', o === b ? 'true' : 'false')); S.cluster = clusters[+b.dataset.i]; S.team = null; S.format = null; renderFormats(); renderRail(); });
    renderRail();
    if (clusters.length === 1) $('teams').querySelector('.chip').click();
    $('why').addEventListener('input', sync);
    $('submit').onclick = submit;
  }
  function renderFormats() {
    /* the cluster's formats = the union of its numbers' balls (a Masters number plays both) */
    const balls = [...new Set(S.cluster.entries.flatMap(t => t.balls))].sort(); $('fmtWrap').hidden = false;
    $('fmts').innerHTML = balls.map(b => '<button type="button" class="chip" data-b="' + b + '" aria-pressed="false">' + (b === '8' ? '8-Ball' : '9-Ball') + '</button>').join('');
    $('fmts').querySelectorAll('.chip').forEach(c => c.onclick = () => { $('fmts').querySelectorAll('.chip').forEach(o => o.setAttribute('aria-pressed', o === c ? 'true' : 'false')); S.format = c.dataset.b; S.team = S.cluster.entries.find(t => t.balls.includes(S.format)); renderSl(); });
    if (balls.length === 1) $('fmts').querySelector('.chip').click(); else { $('slWrap').hidden = true; sync(); }
  }
  /* Levels are what the requester KNOWS, exactly like the Google Form — the record is never shown here (operator rule 2026-09-18). */
  function renderSl() {
    $('slWrap').hidden = false;
    const opts = RANGE[S.format].map(n => '<option value="' + n + '">SL' + n + '</option>').join('');
    $('claimed').innerHTML = '<option value="">Pick a level</option>' + opts;
    $('proposed').innerHTML = '<option value="">Pick a level</option>' + opts;
    $('claimed').onchange = sync; $('proposed').onchange = sync; sync();
  }
  /* Desktop rail — a live mirror of the choices (spm-base .spm-rail; display:none below 1200px). */
  function renderRail() {
    const rail = $('rail'); if (!rail) return;
    if (!S.token || !S.about) { rail.innerHTML = ''; return; }
    const row = (k, v) => '<dt>' + k + '</dt><dd' + (v ? '>' + v : ' class="spm-rail-empty">not yet') + '</dd>';
    const fmt = S.format ? (S.format === '8' ? '8-Ball' : '9-Ball') : '';
    const claimed = $('claimed') && $('claimed').value, proposed = $('proposed') && $('proposed').value;
    rail.innerHTML = '<div class="spm-rail-card"><h3>Your request so far</h3><dl>'
      + row('About', S.about === 'self' ? 'Yourself' : (S.subject ? esc(S.subject.name) : ''))
      + row('Team', S.cluster ? esc(S.cluster.label) + (S.cluster.night ? ' · ' + esc(S.cluster.night) : '') : '')
      + row('Format', fmt)
      + row('Levels', claimed && proposed ? 'SL' + esc(claimed) + ' → SL' + esc(proposed) : (claimed ? 'now SL' + esc(claimed) : ''))
      + '</dl><p class="spm-rail-note"><b>Tell us what you saw.</b> Shots, safeties, innings — not just the score. Kept private; you\'ll hear back either way.</p></div>';
  }
  function sync() {
    renderRail();
    const why = ($('why') && $('why').value.trim()) || '';
    const claimed = $('claimed') ? $('claimed').value : '', proposed = $('proposed') ? $('proposed').value : '';
    const same = claimed && proposed && claimed === proposed;
    if ($('err') && same) $('err').textContent = 'Pick a level different from the current one.'; else if ($('err') && /different from the current/.test($('err').textContent)) $('err').textContent = '';
    /* Name every unmet condition — six of them used to fail silently and the operator hit a dead button.
       The narrative is required but NEVER measured (operator: "dont put a min char count", 2026-09-18). */
    const me = S.about === 'self', missing = [];
    if (!S.cluster) missing.push('pick a team');
    else if (!S.format) missing.push('pick 8-Ball or 9-Ball');
    if (!claimed) missing.push(me ? 'your current skill level' : 'their current skill level');
    if (!proposed) missing.push('the level you think is right');
    else if (same) missing.push('a level different from the current one');
    if (!why.length) missing.push('tell us what you saw');
    if (!S.acked) missing.push('tap Got it on the note');
    if ($('need')) $('need').innerHTML = missing.length ? '<b>Still needed:</b> ' + missing.join(' &middot; ') : '';
    $('submit').disabled = !(S.team && S.format && claimed && proposed && !same && why.length > 0 && S.acked);
  }
  async function submit() {
    const err = $('err'); err.textContent = ''; $('submit').disabled = true;
    const r = await gas('sl_submit', { token: S.token, about_self: S.about === 'self', subject: S.subject.member_number, team_number: S.team.team_number, format: S.format, claimed_current_sl: +$('claimed').value, proposed_sl: +$('proposed').value, reasoning: $('why').value.trim(), seen_on: $('seen').value || null, opponent: $('opp').value.trim(), ack: S.acked, hp: $('hp').value, fill_ms: Date.now() - S.opened });
    if (!r.ok) { if (isAuthErr(r.error)) return handleSessionErr(r.error); err.textContent = r.error || 'Something went wrong. Try again.'; sync(); return; }
    app.innerHTML = '<div style="text-align:center;padding:16px 4px"><div style="font-size:2.4rem">🎯</div><h2 style="margin:6px 0">Got it.</h2><p class="lead">Your request is in. The league office will read it, keep it private, and check it against the record. You\'ll get an email either way.</p><button class="btn ghost" id="home">Done</button></div>';
    $('home').onclick = showHome;
  }

  /* ── member picker (CountMeIn/VenueVoice pattern; countmein.member_lookup returns name · # · team) ── */
  let _cdAc = [], _cdTimer = null, _cdFocus = -1, _cdOnPick = null;
  const cdName = p => ([p.first_name, p.last_name].filter(Boolean).join(' ').trim() || '(no name)') + (p.nickname && p.nickname !== p.first_name ? ' “' + p.nickname + '”' : '');
  const cdClose = () => $('cdAc') && $('cdAc').classList.remove('show');
  async function cdSearch(q) { const r = await fetch(SB_URL + '/rest/v1/rpc/member_lookup', { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json', 'Content-Profile': 'countmein', 'Accept-Profile': 'countmein' }, body: JSON.stringify({ p_q: q, p_current: true }) }); return r.ok ? r.json() : []; }   /* p_current: only players rostered THIS session (the sub-text promises exactly that) */
  function cdRender() { const box = $('cdAc'); if (!_cdAc.length) { box.innerHTML = '<div class="cd-ac-item" style="cursor:default;color:#6b7280">No matches — try the APA number.</div>'; box.classList.add('show'); return; }
    box.innerHTML = _cdAc.map((p, i) => '<div class="cd-ac-item' + (i === _cdFocus ? ' on' : '') + '" data-i="' + i + '"><div class="cd-ac-name">' + esc(cdName(p)) + '</div><div class="cd-ac-sub">APA #' + esc(p.member_number) + (p.team_name ? ' · ' + esc(p.team_name) : '') + '</div></div>').join('');
    [...box.querySelectorAll('.cd-ac-item[data-i]')].forEach(el => el.addEventListener('mousedown', e => { e.preventDefault(); cdPick(+el.dataset.i); })); box.classList.add('show'); }
  function cdPick(i) { const p = _cdAc[i]; if (!p) return; cdClose(); $('cdSearch').value = ''; $('cdSearch').hidden = true; const box = $('cdPicked'); box.hidden = false; box.innerHTML = '<span>✓ ' + esc(cdName(p)) + ' · APA #' + esc(p.member_number) + '</span><button type="button" id="cdClearBtn">Not them?</button>'; $('cdClearBtn').onclick = cdClear; if (_cdOnPick) _cdOnPick(p); }
  function cdClear() { $('cdPicked').hidden = true; $('cdPicked').innerHTML = ''; $('cdSearch').hidden = false; $('cdSearch').value = ''; cdClose(); }
  function cdWire(onPick) { _cdOnPick = onPick; const input = $('cdSearch');
    input.addEventListener('input', () => { clearTimeout(_cdTimer); const v = input.value.trim(); if (v.length < 2) { cdClose(); return; } _cdTimer = setTimeout(async () => { try { _cdAc = await cdSearch(v); _cdFocus = -1; cdRender(); } catch (e) { cdClose(); } }, 250); });
    input.addEventListener('keydown', e => { if (!$('cdAc').classList.contains('show')) return; if (e.key === 'ArrowDown') { e.preventDefault(); _cdFocus = Math.min(_cdAc.length - 1, _cdFocus + 1); cdRender(); } else if (e.key === 'ArrowUp') { e.preventDefault(); _cdFocus = Math.max(0, _cdFocus - 1); cdRender(); } else if (e.key === 'Enter') { e.preventDefault(); if (_cdFocus >= 0) cdPick(_cdFocus); } else if (e.key === 'Escape') cdClose(); });
    document.addEventListener('click', e => { if (!e.target.closest('.cd-search')) cdClose(); }); input.focus(); }

  /* ── session ── */
  /* only the auth sentences log you out — 'not on a team right now' etc. are ordinary errors (fresh-eyes finding, 2026-09-18) */
  const isAuthErr = e => spmAuth.isAuthErr(e);
  function handleSessionErr(msg) { spmAuth.clear(); S.token = null; showLogin(msg || 'Your session expired. Sign in again.'); }
  $('logout').onclick = () => { spmAuth.logout(S.token); S.token = null; S.firstName = ''; showLogin(); };
  function boot() {
    const urlToken = new URLSearchParams(location.search).get('token');
    const stored = spmAuth.get();
    const tok = urlToken || stored;
    if (urlToken) history.replaceState(null, '', location.pathname);
    if (!tok) { showLogin(); return; }
    app.innerHTML = '<div style="padding:20px;text-align:center"><span class="spin"></span><p class="sub" style="margin-top:12px">Signing you in…</p></div>';
    gas('sl_verify', { token: tok }).then(r => {
      if (!r.ok) { if (!urlToken || spmAuth.isAuthErr(r.error)) spmAuth.clear(); showLogin(urlToken ? (r.error || 'That link did not work. Request a fresh one.') : ''); return; }
      S.token = tok; S.firstName = r.first_name || ''; spmAuth.set(tok);
      showHome();
    });
  }

  /* ── Auto-updater (checkVersion → pollForDeploy; reference_deploy.md) ── */
  function cmpVer(a, b) { const pa = String(a).split('.'), pb = String(b).split('.'); for (let i = 0; i < Math.max(pa.length, pb.length); i++) { const x = parseInt(pa[i], 10) || 0, y = parseInt(pb[i], 10) || 0; if (x > y) return 1; if (x < y) return -1; } return 0; }
  let _versionMismatch = false;
  async function checkVersion() {
    try { const r = await fetch(SB_URL + '/rest/v1/apps?app_name=eq.' + APP_NAME + '&select=version', { headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Accept-Profile': 'apa_core' } }); const rows = await r.json(); const v = rows && rows[0] && rows[0].version;
      if (v && cmpVer(v, window.APP_VERSION) > 0 && !_versionMismatch) { if (document.querySelector('#why') && $('why').value) return; _versionMismatch = true; $('updateOverlay').classList.add('show'); pollForDeploy(); } } catch (e) {}
  }
  function pollForDeploy() { const t = setInterval(async () => { try { const r = await fetch('version.js?_=' + Date.now(), { cache: 'no-store' }); const m = (await r.text()).match(/APP_VERSION\s*=\s*'([^']+)'/); if (m && cmpVer(m[1], window.APP_VERSION) > 0) { clearInterval(t); location.reload(); } } catch (e) {} }, 15000); }
  setInterval(checkVersion, 30000);
  spmAuth.onChange(function(t){ if((t||'')!==(S.token||'')) location.reload(); });   /* SSO: another app signed in/out */
  boot();
</script>
</body>
